name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_source:
        description: "Zu veröffentlichende Insight-Quelle"
        required: true
        default: "sanity"
        type: choice
        options:
          - sanity
          - directus

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          if [ "$VITE_CONTENT_SOURCE" = "directus" ]; then
            npm run build:directus
          else
            npm run build
          fi
        env:
          VITE_CONTENT_SOURCE: ${{ inputs.content_source || 'sanity' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
